name: sec-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in \
            "stock-seasonality daily-watch ${{ github.repository_owner }}@users.noreply.github.com" \
            "${{ github.repository_owner }} ${{ github.repository_owner }}@users.noreply.github.com" \
            "stock-seasonality ${{ github.repository_owner }}@gmail.com" \
            "Sample Company Name AdminContact@samplecompany.com" \
            "curl/8"; do
            for u in https://www.sec.gov/files/company_tickers.json https://data.sec.gov/submissions/CIK0000320193.json; do
              code=$(curl -s --compressed -A "$ua" -o body.txt -w "%{http_code}" "$u")
              echo "[$code] UA='$ua' $u :: $(head -c 160 body.txt | tr -s '\n\t ' ' ')"
              sleep 1
            done
          done
          curl -s https://ifconfig.me; echo
